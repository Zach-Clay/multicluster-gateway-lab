# HTTPRoutes live with the application team, in the app namespace, and attach to the
# platform team's Gateway via parentRefs. That split of ownership is the point of Gateway API.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orders
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: ingress
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api/orders }
      backendRefs:
        - name: orders
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: users
spec:
  parentRefs:
    - name: cluster-gateway
      namespace: ingress
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api/users }
      backendRefs:
        - name: users
          port: 80

# A namespace-scoped waypoint. The ambient controller turns this Gateway into an
# Envoy deployment; ztunnel sends Service traffic here for L7 processing.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: waypoint
  labels:
    istio.io/waypoint-for: service
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE

# The cluster's single ingress Gateway. Envoy Gateway turns this into an Envoy Deployment
# plus a LoadBalancer Service, and MetalLB gives that Service an IP on the kind network.
apiVersion: v1
kind: Namespace
metadata:
  name: ingress
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cluster-gateway
  namespace: ingress
spec:
  gatewayClassName: envoy-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        # Only namespaces that opt in with this label may attach HTTPRoutes.
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access: "true"
